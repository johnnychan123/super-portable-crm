appId: com.superportablecrm.app
productName: Super Portable CRM
npmRebuild: false
asar: true

directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

win:
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
  artifactName: Super-Portable-CRM-${version}-Windows-${arch}-Portable.${ext}

mac:
  identity: null
  target:
    - target: zip
      arch:
        - arm64
        - x64
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  artifactName: Super-Portable-CRM-${version}-macOS-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  synopsis: Portable CRM and Excel Data Processor
  artifactName: Super-Portable-CRM-${version}-Linux-${arch}.${ext}
